
<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
        <meta name="color-scheme" content="dark">
        <meta name="theme-color" content="#17181a">
        <meta name="description" content="Kuro panel — dashboard, keys, games, and sellers.">
        <title>Sign in · Kuro</title>
        <link rel="icon" type="image/svg+xml" href="logo.svg">
        <script type="module" src="js/panel.js?v=270359cf1900"></script>
        <link rel="stylesheet" href="css/base.css">
        <link rel="stylesheet" href="css/layout.css">
        <link rel="stylesheet" href="css/components.css">
        <link rel="stylesheet" href="css/pages/dashboard.css">
        <link rel="stylesheet" href="css/pages/accounts.css">
        <link rel="stylesheet" href="css/pages/sellers.css">
        <link rel="stylesheet" href="css/pages/keys.css?v=69d184e117b6">
        <link rel="stylesheet" href="css/pages/games.css">
        <link rel="stylesheet" href="css/pages/app.css">
    </head>
    <body>
        <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <symbol id="i-dashboard" viewBox="0 0 24 24">
                <path d="M4 13v7M12 4v16M20 9v11"/>
            </symbol>
            <symbol id="i-key" viewBox="0 0 24 24">
                <circle cx="15.5" cy="8.5" r="5.5"/>
                <path d="m11.5 12.5-8 8H3V17l3-3h3v-3M17 7h.01"/>
            </symbol>
            <symbol id="i-game" viewBox="0 0 24 24">
                <path d="M8 7h8c3 0 4 3 5 9 .5 3-2 4-4 2l-2-2H9l-2 2c-2 2-4.5 1-4-2 1-6 2-9 5-9ZM6 11h4M8 9v4M15 11h.01M18 13h.01"/>
            </symbol>
            <symbol id="i-store" viewBox="0 0 24 24">
                <path d="M4 11v9h16v-9M9 20v-6h6v6M3 7l2-4h14l2 4v2a3 3 0 0 1-4.5 2.6A3 3 0 0 1 12 11a3 3 0 0 1-4.5.6A3 3 0 0 1 3 9V7ZM3 7h18"/>
            </symbol>
            <symbol id="i-app" viewBox="0 0 24 24">
                <rect x="6" y="2" width="12" height="20" rx="3"/>
                <path d="M10 18h4M10 5h4"/>
            </symbol>
            <symbol id="i-calendar" viewBox="0 0 24 24">
                <rect x="3" y="5" width="18" height="16" rx="3"/>
                <path d="M7 3v4M17 3v4M3 11h18"/>
            </symbol>
            <symbol id="i-menu" viewBox="0 0 24 24">
                <path d="M4 6h16M4 12h16M4 18h16"/>
            </symbol>
            <symbol id="i-close" viewBox="0 0 24 24">
                <path d="m6 6 12 12M6 18 18 6"/>
            </symbol>
            <symbol id="i-trash" viewBox="0 0 24 24">
                <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7M14 10v7"/>
            </symbol>
            <symbol id="i-plus" viewBox="0 0 24 24">
                <path d="M5 12h14M12 5v14"/>
            </symbol>
            <symbol id="i-more" viewBox="0 0 24 24">
                <path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3"/>
            </symbol>
            <symbol id="i-deselect" viewBox="0 0 24 24">
                <rect x="4" y="4" width="16" height="16" rx="3"/>
                <path d="M8 12h8"/>
            </symbol>
            <symbol id="i-eye" viewBox="0 0 24 24">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
            </symbol>
            <symbol id="i-eye-off" viewBox="0 0 24 24">
                <path d="m3 3 18 18M10.6 5.1 12 5c6.5 0 10 7 10 7a20 20 0 0 1-3 3.7M6.5 6.5A22 22 0 0 0 2 12s3.5 7 10 7a11 11 0 0 0 5.5-1.5M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
            </symbol>
            <symbol id="i-copy" viewBox="0 0 24 24">
                <rect x="8" y="8" width="12" height="12" rx="2"/>
                <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>
            </symbol>
            <symbol id="i-reset" viewBox="0 0 24 24">
                <path d="M3 10a9 9 0 1 1 2.6 8.4M3 4v6h6"/>
            </symbol>
            <symbol id="i-ban" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"/>
                <path d="m6 6 12 12"/>
            </symbol>
            <symbol id="i-check" viewBox="0 0 24 24">
                <path d="m5 12 4 4L19 6"/>
            </symbol>
            <symbol id="i-search" viewBox="0 0 24 24">
                <circle cx="10.5" cy="10.5" r="6.5"/>
                <path d="m16 16 4 4"/>
            </symbol>
            <symbol id="i-logout" viewBox="0 0 24 24">
                <path d="M10 4H5v16h5m-1-8h12m-4-4 4 4-4 4"/>
            </symbol>
        </svg>
        <div class="view-status" id="view-status" role="status" tabindex="-1">
            <p>Loading panel…</p>
            <button class="primary-button" type="button" data-retry-view hidden>Try again</button>
        </div>
        <noscript>
            <p class="no-script">Enable JavaScript to sign in.</p>
        </noscript>
        <a class="skip-link" href="#main" data-panel hidden>Skip to content</a>
        <button class="icon-button" id="sidebar-toggle" aria-controls="sidebar" aria-expanded="true" aria-label="Collapse sidebar" title="Collapse sidebar" data-panel hidden>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m14 7-5 5 5 5"/>
            </svg>
        </button>
        <aside class="sidebar" id="sidebar" aria-label="Main navigation" data-panel hidden>
            <div class="sidebar-header">
                <a class="brand" href="#dashboard" aria-label="Kuro dashboard">
                    <img src="logo.svg" width="30" height="30" alt="">
                    <span>Kuro</span>
                </a>
            </div>
            <nav id="navigation" aria-label="Owner panel">
                <a class="nav-item selected" href="#dashboard" data-route="dashboard" aria-current="page" aria-label="Dashboard" title="Dashboard">
                    <svg class="icon" aria-hidden="true">
                        <use href="#i-dashboard"/>
                    </svg>
                    <span class="nav-label">Dashboard</span>
                </a>
                <a class="nav-item" href="#keys" data-route="keys" aria-label="Keys" title="Keys">
                    <svg class="icon" aria-hidden="true">
                        <use href="#i-key"/>
                    </svg>
                    <span class="nav-label">Keys</span>
                </a>
                <a class="nav-item" href="#games" data-route="games" data-owner-only aria-label="Games" title="Games">
                    <svg class="icon" aria-hidden="true">
                        <use href="#i-game"/>
                    </svg>
                    <span class="nav-label">Games</span>
                </a>
                <a class="nav-item" href="#sellers" data-route="sellers" data-owner-only aria-label="Sellers" title="Sellers">
                    <svg class="icon" aria-hidden="true">
                        <use href="#i-store"/>
                    </svg>
                    <span class="nav-label">Sellers</span>
                </a>
                <a class="nav-item" href="#app" data-route="app" data-owner-only aria-label="App" title="App">
                    <svg class="icon" aria-hidden="true">
                        <use href="#i-app"/>
                    </svg>
                    <span class="nav-label">App</span>
                </a>
            </nav>
            <div class="account-controls">
                <button class="account" type="button" data-profile aria-label="Open profile" aria-haspopup="dialog">
                    <span class="avatar" aria-hidden="true">O</span>
                    <span class="account-label">
                        <span data-account-name>Owner</span>
                        <small>Profile</small>
                    </span>
                    <svg class="icon account-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
                </button>
                <button class="icon-button" type="button" data-sign-out aria-label="Log out">
                    <svg class="icon" aria-hidden="true">
                        <use href="#i-logout"/>
                    </svg>
                </button>
            </div>
        </aside>
        <main id="main" tabindex="-1" data-panel hidden>
            <header class="page-header">
                <h1>Dashboard</h1>
                <div class="header-actions">
                    <div class="wallet-summary" data-wallet aria-label="Wallet balance" hidden>
                        <span>Wallet</span>
                        <strong></strong>
                    </div>
                    <button class="icon-button" id="menu-button" aria-label="Open navigation" aria-haspopup="dialog">
                        <svg class="icon" aria-hidden="true">
                            <use href="#i-menu"/>
                        </svg>
                    </button>
                </div>
            </header>
        </main>
        <dialog id="mobile-navigation" aria-labelledby="menu-heading">
            <div class="dialog-heading">
                <h2 class="brand" id="menu-heading">
                    <img src="logo.svg" width="28" height="28" alt="">
                    <span>Kuro</span>
                </h2>
                <button class="icon-button" type="button" data-close aria-label="Close navigation">
                    <svg class="icon">
                        <use href="#i-close"/>
                    </svg>
                </button>
            </div>
            <div id="mobile-nav-content"></div>
            <div class="mobile-account">
                <button class="mobile-profile" type="button" data-profile aria-label="Open profile" aria-haspopup="dialog">
                    <span class="avatar" aria-hidden="true"></span>
                    <span class="account-label">
                        <span data-account-name></span>
                        <small>Profile</small>
                    </span>
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
                </button>
                <button class="icon-button" type="button" data-sign-out aria-label="Log out">
                    <svg class="icon" aria-hidden="true">
                        <use href="#i-logout"/>
                    </svg>
                </button>
            </div>
        </dialog>
        <div id="notification" popover="manual">
            <svg class="icon notification-success" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9"/>
                <path d="m8 12 3 3 5-6"/>
            </svg>
            <svg class="icon notification-error" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 7v6m0 3h.01"/>
            </svg>
            <span role="status" aria-atomic="true"></span>
        </div>
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4bc70e2c01a94c73b74392e4234840661791215815920" integrity="sha512-L0ha0OXavK/8okipN9F8BtP84dg9DUhPERbBXzwI6dgTA55d2+yweo3pn5CSFYs45/r8md2+xvUPtTdvTNRfjA==" data-cf-beacon='{"version":"2024.11.0","token":"07ffd97ab1e047f195dbcd595e2d1065","r":1,"spa":2}' crossorigin="anonymous"></script>
</body>
</html>
